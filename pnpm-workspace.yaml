allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Security fixes for transitive dependencies pinned to vulnerable versions
# (Dependabot alerts). Drop each once its parent ships a fixed version.
overrides:
  # satori@0.33.5 pins fflate@0.7.3
  fflate@<0.7.5: ~0.7.5
  # chevrotain@11.1.2 (via mermaid) pins lodash-es@4.17.23
  lodash-es@<4.18.0: ^4.18.1
  # @tailwindcss/typography@0.5.20 pins postcss-selector-parser@6.0.10
  postcss-selector-parser@<7.1.6: ^7.1.6
  # miniflare@5.20261012.0-beta (via wrangler) pins undici@7.29.1
  undici@>=7.18.0 <7.30.1: ~7.30.1
