<style>
  /* Update → Model → View on top, Elm Runtime across the bottom; Msg goes up
     into Update, String comes down out of View, Init feeds the runtime.
     The frame keeps the column's width; the diagram is centered in it. */
  .flow {
    display: grid;
    grid-template-columns: auto minmax(2.5rem, 1fr) auto minmax(2.5rem, 1fr) auto minmax(2.5rem, 1fr) auto;
    align-items: center;
    max-width: 34rem;
    margin-inline: auto;
  }

  .box {
    border: 1px solid var(--fig-line);
    border-radius: var(--fig-radius-sm);
    background: var(--fig-surface);
    padding: var(--fig-space-2) var(--fig-space-3);
    font-family: var(--font-mono);
    text-align: center;
  }

  .update { grid-area: 1 / 3; }
  .model  { grid-area: 1 / 5; }
  .view   { grid-area: 1 / 7; }
  .init   { grid-area: 3 / 1; }

  .runtime {
    grid-area: 3 / 3 / 4 / 8;
    border-color: var(--fig-blue);
    color: var(--fig-blue);
    font-weight: 700;
  }

  /* horizontal arrow: a line with a head, its label above */
  .right {
    position: relative;
    height: 1px;
    margin: 0 var(--fig-space-1);
    background: var(--fig-line);
  }

  .right::after {
    content: '';
    position: absolute;
    top: -4px;
    right: -1px;
    border: 4.5px solid transparent;
    border-right: 0;
    border-left: 7px solid var(--fig-line);
  }

  .right .note {
    position: absolute;
    bottom: var(--fig-space-1);
    left: 0;
    right: 0;
    text-align: center;
  }

  .a1 { grid-area: 1 / 4; }
  .a2 { grid-area: 1 / 6; }
  .a3 { grid-area: 3 / 2; }

  /* vertical arrow: a line with a head, its label beside */
  .vertical {
    position: relative;
    justify-self: center;
    width: 1px;
    height: 2.75rem;
    background: var(--fig-line);
  }

  .vertical::after {
    content: '';
    position: absolute;
    left: -4px;
    border: 4.5px solid transparent;
  }

  .up { grid-area: 2 / 3; }

  .up::after {
    top: -1px;
    border-top: 0;
    border-bottom: 7px solid var(--fig-line);
  }

  .down { grid-area: 2 / 7; }

  .down::after {
    bottom: -1px;
    border-bottom: 0;
    border-top: 7px solid var(--fig-line);
  }

  .vertical .note {
    position: absolute;
    top: 50%;
    left: var(--fig-space-2);
    transform: translateY(-50%);
    white-space: nowrap;
  }

  /* String sits left of its arrow, inside the diagram's right edge */
  .down .note {
    left: auto;
    right: var(--fig-space-2);
  }

  /* phones: smaller boxes and shorter arrows, so it fits without scrolling */
  @media (max-width: 30rem) {
    .flow {
      grid-template-columns: auto minmax(1.25rem, 1fr) auto minmax(1.25rem, 1fr) auto minmax(1.25rem, 1fr) auto;
    }

    .box {
      padding: var(--fig-space-1) var(--fig-space-2);
      font-size: var(--fig-text-sm);
    }

    .right {
      margin: 0;
    }
  }
</style>

<div class="flow">
  <div class="box update">Update</div>
  <div class="right a1"></div>
  <div class="box model">Model</div>
  <div class="right a2"></div>
  <div class="box view">View</div>

  <div class="vertical up"><span class="note">Msg</span></div>
  <div class="vertical down"><span class="note">String</span></div>

  <div class="box init">Init</div>
  <div class="right a3"><span class="note">Msg</span></div>
  <div class="box runtime">Elm Runtime</div>
</div>
