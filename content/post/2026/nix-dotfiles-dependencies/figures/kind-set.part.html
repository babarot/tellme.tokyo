<div class="headline">3. ツールのセット</div>

<div class="nixfile">
  <div class="nixfile-name"><code>kubernetes.set.nix</code></div>
  <div class="subject">Kubernetes を触るためのセット<span class="note">（主役のツールはいない）</span></div>
  <div class="members">
    <ul class="tree">
      <li>
        <div class="row"><span class="tool green">kubectl</span></div>
        <ul>
          <li><div class="row"><span class="role">設定</span><span class="setting">abbr k=kubectl</span></div></li>
          <li><div class="row"><span class="tool companion">kubectl-view-secret</span><span class="role">付属ツール</span></div></li>
        </ul>
      </li>
    </ul>
    <ul class="tree">
      <li>
        <div class="row"><span class="tool green">kubectx</span></div>
        <ul><li><div class="row"><span class="role">設定</span><span class="setting">kubectl ctx / ns のリンク</span></div></li></ul>
      </li>
    </ul>
    <ul class="tree">
      <li>
        <div class="row"><span class="tool green">krew</span></div>
        <ul><li><div class="row"><span class="role">設定</span><span class="setting">my.path ~/.krew/bin</span></div></li></ul>
      </li>
    </ul>
    <div class="plain"><span class="tool green">helmfile</span><span class="tool green">kustomize</span><span class="tool green">kail</span><span class="note">…</span></div>
  </div>
</div>

<div class="caption">設定を持つツールも、付属ツールを持つツールも、設定のないツールも入る。Kubernetes を触らなくなったら、セットごと消える。</div>
