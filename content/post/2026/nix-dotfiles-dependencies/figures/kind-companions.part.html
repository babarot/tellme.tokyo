<div class="headline">2. 付属ツールを持つツール</div>

<div class="nixfile">
  <div class="nixfile-name"><code>gh.nix</code></div>
  <ul class="tree">
    <li>
      <div class="row"><span class="tool blue">gh</span><span class="role">本体</span></div>
      <ul>
        <li><div class="row"><span class="role">設定</span><span class="setting">gh-dash（gh の拡張）を入れる</span></div></li>
        <li><div class="row"><span class="tool companion">delta</span><span class="role">付属ツール</span><span class="note">gh-dash が diff の表示に使う</span></div></li>
        <li><div class="row"><span class="tool companion">lazygit</span><span class="role">付属ツール</span><span class="note">gh-dash から開く</span></div></li>
      </ul>
    </li>
  </ul>
</div>

<div class="caption">点線が付属ツール。ファイルを消すと、gh と一緒に付属ツールも消える。付属ツールだけを消しても、gh は残る。</div>
