[tools]
node = "24"

[tasks.dev]
description = "Run the dev server; stop, status and logs go to astro dev (help: mise run dev --help)"
run = "node tools/dev.ts"
# Hand the arguments to dev.ts as typed; usage below only feeds completion
raw_args = true
usage = """
arg "[command]" help="astro dev's own: a running server" {
  choices "stop" "status" "logs"
}
flag "--published" help="published posts (alone: as production)"
flag "--draft" help="drafts"
flag "--hidden" help="hidden posts"
flag "--all" help="every state, hidden too"
flag "--background" help="run as a background process"
flag "--port <port>" help="default: 4321"
flag "--host" help="listen on all addresses"
flag "--open" help="open the browser on start"
flag "--force" help="clear the content layer cache"
flag "--follow" help="logs: keep following"
flag "-h --help" help="show the help"
"""
# Ctrl-C has to reach astro dev
raw = true
quiet = true

[tasks.post]
description = "List posts by front matter, or edit or open the ones picked with fzf (help: mise run post --help)"
run = "node tools/post.ts"
# Hand the arguments to post.ts as typed; usage below only feeds completion
raw_args = true
usage = """
arg "<command>" help="what to do" {
  choices "ls" "edit" "open" "tags" "check"
}
arg "[query]..." help="edit, open: fzf's first input" var=#true
flag "--draft" help="drafts"
flag "--published" help="published posts"
flag "--hidden" help="hidden posts"
flag "--all" help="every state, hidden too"
flag "--tag <name>" help="has the tag (repeatable: all of them)" var=#true
flag "--since <date>" help="from this date, as a prefix: 2020, 2023-06"
flag "--until <date>" help="up to this date, as a prefix"
flag "--grep <pattern>" help="the source matches (rg)"
flag "--sort <by>" help="default: date" {
  choices "date" "title"
}
flag "--reverse" help="reverse the order"
flag "--format <format>" help="ls: default tsv" {
  choices "tsv" "json" "path"
}
flag "--no-fzf" help="edit, open: every post that passes the filters"
flag "--fix" help="check: add the missing keys and put them in order"
flag "-h --help" help="show the help"
complete "name" run="node {{config_root}}/tools/post.ts tags --all"
"""
# fzf and the editor need the terminal
raw = true
quiet = true
